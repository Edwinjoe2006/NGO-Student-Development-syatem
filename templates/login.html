<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Development System - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            height:100vh;

            background: linear-gradient(
                135deg,
                #4e73df,
                #1cc88a
            );

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Segoe UI',sans-serif;
        }

        .login-card{
            width:450px;
            background:white;

            padding:35px;

            border-radius:20px;

            box-shadow:
            0px 15px 40px rgba(0,0,0,0.25);

            text-align:center;
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:5px solid #4e73df;
            margin-bottom:15px;
        }

        .title{
            color:#4e73df;
            font-weight:bold;
        }

        .subtitle{
            color:gray;
            margin-bottom:25px;
        }

        .form-control{
            height:50px;
            border-radius:10px;
        }

        .btn-login{
            width:100%;
            height:50px;

            border:none;

            border-radius:10px;

            background:#4e73df;

            color:white;

            font-size:18px;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#224abe;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <img
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        class="profile-img">

        <h2 class="title">
            Student Development System
        </h2>

        <p class="subtitle">
            NGO Admin Login
        </p>

        <form method="POST" action="/login">

            <div class="mb-3 text-start">

                <label class="form-label">
                    Username
                </label>

                <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                required>

            </div>

            <div class="mb-3 text-start">

                <label class="form-label">
                    Password
                </label>

                <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required>

            </div>

            <button
            type="submit"
            class="btn-login">
                Login
            </button>

        </form>

    </div>

</body>
</html>
