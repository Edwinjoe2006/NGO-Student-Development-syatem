<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">
            Student Development Management System
        </span>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Add New Student</h3>
        </div>

        <div class="card-body">

            <form action="/save_student" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Age</label>
                        <input type="number"
                               name="age"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Gender</label>
                        <select name="gender"
                                class="form-control">
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>School</label>
                        <input type="text"
                               name="school"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Class</label>
                        <select name="class_name"
                                class="form-control">
                            <option>6th</option>
                            <option>7th</option>
                            <option>8th</option>
                            <option>9th</option>
                            <option>10th</option>
                            <option>11th</option>
                            <option>12th</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Favorite Subject</label>
                        <input type="text"
                               name="favorite_subject"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Difficult Subject</label>
                        <input type="text"
                               name="difficult_subject"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Hobbies</label>
                        <input type="text"
                               name="hobbies"
                               class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Career Goal</label>
                        <select name="career_goal"
                                class="form-control">
                            <option>Engineer</option>
                            <option>Doctor</option>
                            <option>Teacher</option>
                            <option>Scientist</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Smartphone Access</label>
                        <select name="smartphone_access"
                                class="form-control">
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Internet Access</label>
                        <select name="internet_access"
                                class="form-control">
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>NGO Support</label>
                        <select name="ngo_support"
                                class="form-control">
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                </div>

                <button class="btn btn-success">
                    Save Student
                </button>

                <a href="/students"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
