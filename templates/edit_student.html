<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Student</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"></head><body class="bg-light"><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-8"><div class="card shadow"><div class="card-header bg-warning text-dark"><h2 class="text-center">
Edit Student Information
</h2></div><div class="card-body"><form method="POST" action="/update_student/{{ student.id }}"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Name</label>

<input type="text"
name="name"
class="form-control"
value="{{ student.name }}"
required>

</div><div class="col-md-6 mb-3"><label class="form-label">Age</label>

<input type="number"
name="age"
class="form-control"
value="{{ student.age }}"
required>

</div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Gender</label>

<input type="text"
name="gender"
class="form-control"
value="{{ student.gender }}">

</div><div class="col-md-6 mb-3"><label class="form-label">School</label>

<input type="text"
name="school"
class="form-control"
value="{{ student.school }}">

</div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Class</label>

<input type="text"
name="class_name"
class="form-control"
value="{{ student.class_name }}">

</div><div class="col-md-6 mb-3"><label class="form-label">Career Goal</label>

<input type="text"
name="career_goal"
class="form-control"
value="{{ student.career_goal }}">

</div></div><div class="mb-3"><label class="form-label">Favorite Subject</label>

<input type="text"
name="favorite_subject"
class="form-control"
value="{{ student.favorite_subject }}">

</div><div class="mb-3"><label class="form-label">Difficult Subject</label>

<input type="text"
name="difficult_subject"
class="form-control"
value="{{ student.difficult_subject }}">

</div><div class="mb-3"><label class="form-label">Hobbies</label>

<input type="text"
name="hobbies"
class="form-control"
value="{{ student.hobbies }}">

</div><div class="row"><div class="col-md-4 mb-3"><label class="form-label">Internet Access</label>

<select name="internet_access"
class="form-control">

<option value="Yes">Yes</option>
<option value="No">No</option></select></div><div class="col-md-4 mb-3"><label class="form-label">Smartphone Access</label>

<select name="smartphone_access"
class="form-control">

<option value="Yes">Yes</option>
<option value="No">No</option></select></div><div class="col-md-4 mb-3"><label class="form-label">NGO Support</label>

<select name="ngo_support"
class="form-control">

<option value="Yes">Yes</option>
<option value="No">No</option></select></div></div><div class="text-center"><button type="submit"
class="btn btn-success">

Update Student

</button><a href="/students"
class="btn btn-secondary">

Cancel

</a></div></form></div></div></div></div></div></body></html>
